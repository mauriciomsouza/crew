<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>crew · launch poster</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      .poster {
        background:
          radial-gradient(ellipse 700px 520px at 100% 0%, rgb(60 207 230 / 0.16), transparent 70%),
          radial-gradient(ellipse 760px 560px at 75% 80%, rgb(60 207 230 / 0.14), transparent 70%),
          radial-gradient(ellipse 600px 460px at 0% 100%, rgb(199 146 234 / 0.12), transparent 70%),
          var(--bg);
      }
      h1 {
        margin-top: 76px !important;
        font-size: 120px;
      }
      .sub {
        margin-top: 32px;
        max-width: 860px;
      }
      .hero {
        position: absolute;
        inset: 0;
        perspective: 2600px;
      }
      .win {
        position: absolute;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #2a2d35;
        background: #0d0e11;
      }
      .win.init {
        left: 250px;
        top: 590px;
        transform: rotateY(-18deg) rotateX(7deg) rotateZ(1deg);
        transform-origin: left center;
        box-shadow:
          -30px 60px 120px -30px rgb(0 0 0 / 0.95),
          0 0 0 1px rgb(60 207 230 / 0.18),
          0 0 140px 0 rgb(60 207 230 / 0.16);
      }
      .win.doctor {
        left: 72px;
        top: 945px;
        transform: rotateZ(-2deg);
        box-shadow: 0 50px 90px -30px rgb(0 0 0 / 0.95);
      }
      .win.doctor .bar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid #1d1f25;
        font-family: var(--mono);
        font-size: 14px;
        color: var(--text-3);
      }
      .win.doctor .bar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2b2e36;
      }
      .chip.gate {
        position: absolute;
        left: 600px;
        top: 1120px;
        transform: rotateZ(-3deg);
        font-family: var(--mono);
        font-size: 18px;
      }
      .chip.gate span {
        color: var(--magenta);
      }
    </style>
  </head>
  <body>
    <section class="poster">
      <div class="table"></div>
      <header class="top">
        <div class="wordmark">
          <svg viewBox="0 0 24 24" fill="#3ccfe6" aria-hidden="true">
            <circle cx="12" cy="12" r="3.4" />
            <circle cx="12.00" cy="3.80" r="1.9" />
            <circle cx="18.41" cy="6.89" r="1.9" />
            <circle cx="19.99" cy="13.82" r="1.9" />
            <circle cx="15.56" cy="19.39" r="1.9" />
            <circle cx="8.44" cy="19.39" r="1.9" />
            <circle cx="4.01" cy="13.82" r="1.9" />
            <circle cx="5.59" cy="6.89" r="1.9" />
          </svg>
          crew
        </div>
        <div class="eyebrow">Agent team for Claude Code</div>
      </header>

      <h1 class="display">Ship like a<br /><span class="accent">team of eight.</span></h1>
      <p class="sub">
        Roles, briefs, <b>independent review</b> and <b>human gates</b>, scaffolded into any repo
        with one command.
      </p>

      <div class="hero">
        <div class="win init">
          <div class="crop" style="--x: 168; --y: 104; --w: 2064; --h: 860; --iw: 2400; --k: 0.5">
            <img src="../../docs/design/screens/terminal-init.png" alt="" />
          </div>
        </div>

        <div class="win doctor">
          <div class="bar">
            <i></i><i></i><i></i><span style="margin-left: 8px">npx create-crew doctor</span>
          </div>
          <div class="crop" style="--x: 200; --y: 1196; --w: 1000; --h: 380; --iw: 2400; --k: 0.5">
            <img src="../../docs/design/screens/terminal-doctor.png" alt="" />
          </div>
        </div>

        <div class="chip gate">
          <span>◆ G2 Design</span>&nbsp;<span style="color: var(--text-2)">waiting for you</span>
        </div>
      </div>

      <footer class="bottom">
        <div class="left">
          <span class="tag"><i></i>Open source · free</span>
          <span class="url">mauriciomsouza.github.io/crew</span>
        </div>
        <div class="sig">
          <div>
            <div class="who">Mauricio Souza</div>
            <div class="role">Design Engineer</div>
          </div>
          <div class="monogram">MS</div>
        </div>
      </footer>
    </section>
  </body>
</html>
