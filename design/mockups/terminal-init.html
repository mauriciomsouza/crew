<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Mockup — crew init</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../assets/site.css" />
    <style>
      body { background: radial-gradient(120% 80% at 50% 0%, #1a2a30 0%, #0b0c0e 60%); min-height: 100vh; display: grid; place-items: center; padding: 48px; }
      .term { width: 1040px; font-size: 15px; }
      .term-body { padding: 22px 28px 28px; }
    </style>
  </head>
  <body>
    <div class="term"><div class="term-bar"><i></i><i></i><i></i><span class="term-title">~/parcel — zsh</span></div><pre class="term-body" id="t"></pre></div>
    <script type="module">
      import { planInit, withDefaults } from '../assets/crew.js';
      import { initOutput, prompt } from '../assets/term.js';
      const config = withDefaults({ name: 'Parcel', description: 'A habit tracker for people who keep breaking streaks.', roles: ['business', 'design', 'dev', 'qa', 'release'] });
      const files = planInit(config);
      document.getElementById('t').innerHTML = [prompt('npx create-crew --yes --name Parcel --roles business,design,dev,qa,release'), ...initOutput(config, files)].join('\n');
    </script>
  </body>
</html>
