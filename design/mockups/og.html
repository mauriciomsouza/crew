<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Mockup — social card</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../assets/site.css" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(80% 90% at 85% 20%, #10323a 0%, transparent 60%), #0b0c0e; padding: 72px 80px; display: grid; align-content: space-between; }
      .brand { font-size: 26px; gap: 14px; }
      .brand-mark { width: 34px; height: 34px; }
      h1 { font: 650 84px/1.0 var(--sans); letter-spacing: -0.045em; }
      h1 .soft { color: var(--text-faint); font-size: 56px; letter-spacing: -0.035em; }
      .row { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font: 500 22px/1 var(--mono); }
      .cmd { font-size: 22px; min-height: 60px; padding: 0 24px; background: #15171b; border-color: #2a2c33; }
    </style>
  </head>
  <body>
    <span class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color:var(--accent)"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="3.8" r="1.9"/><circle cx="18.41" cy="6.89" r="1.9"/><circle cx="19.99" cy="13.82" r="1.9"/><circle cx="15.56" cy="19.39" r="1.9"/><circle cx="8.44" cy="19.39" r="1.9"/><circle cx="4.01" cy="13.82" r="1.9"/><circle cx="5.59" cy="6.89" r="1.9"/></svg> crew</span>
    <h1>Ship like a team of eight.<br /><span class="soft">An agent team for Claude Code.</span></h1>
    <div class="row"><span class="cmd"><span class="prompt">$</span>npx create-crew</span><span>roles · briefs · review · human gates</span></div>
  </body>
</html>
